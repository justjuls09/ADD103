<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Techie Tina Solutions</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <img src="images/logo.jpg" alt="Techie Tina Solutions Incorporated Logo">  

    <nav>
        <ul class="nav-list">
            <li><a href="index.html">Home</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

</header>

<main>

<section class="contact-layout">

    <div class="card">

        <h2>Get In Touch</h2>

        <p>
            Contact Techie Tina Solutions Incorporated to
            discuss your technology needs.
        </p>

        <p><strong>Email:</strong> techietinasolutions@gmail.com</p>

        <p><strong>Location:</strong> Johnsburg, Illinois</p>

        <p><strong>Support:</strong> Remote & On-Site Services</p>

    </div>

    <div class="card">

        <form>

            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required>

            <label for="service">Requested Service</label>

            <select id="service" name="service">

                <option>Website Development</option>

                <option>Computer Repair</option>

                <option>Remote Support</option>

                <option>Networking Solutions</option>

                <option>Cybersecurity Consulting</option>

                <option>Cloud Services</option>

            </select>

            <label for="message">Message</label>

            <textarea
                id="message"
                name="message"
                rows="6"
                required></textarea>

            <button type="submit">
                Send Message
            </button>

        </form>

    </div>

</section>

</main>

<footer>
    <p>&copy; 2026 Techie Tina Solutions Incorporated</p>
</footer>

</body>
</html>
