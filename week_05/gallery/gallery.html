<body>

    <h1>Dog Breed Showcase</h1>

    <div class="gallery-row">

        <div class="card">
            <img class="gallery-pic" src="../images/golden-retriever.jpg" alt="Golden Retriever">
            <h3>Golden Retriever</h3>
            <p>Friendly, intelligent, and perfect for families.</p>
        </div>

        <div class="card">
            <img class="gallery-pic" src="../images/german-shepherd.jpg" alt="German Shepherd">
            <h3>German Shepherd</h3>
            <p>Loyal, courageous, and often used as working dogs.</p>
        </div>

        <div class="card">
            <img class="gallery-pic" src="../images/siberian-husky.jpg" alt="Siberian Husky">   
            <h3>Siberian Husky</h3>
