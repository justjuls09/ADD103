<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Light Switch</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 100px;
            background-color: white;
            color: black;
            transition: 0.5s;
        }

        .dark-mode {
            background-color: #222;
            color: white;
        }

        button {
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
        }

        h2 {
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Light Switch Project</h1>

    <button id="toggleButton">Toggle Light/Dark Mode</button>

    <h2 id="message">Click this text!</h2>

    <script>
        // Select elements
        const button = document.getElementById("toggleButton");
        const text = document.getElementById("message");

        // Toggle dark mode when button is clicked
        button.addEventListener("click", function() {
            document.body.classList.toggle("dark-mode");

            if (document.body.classList.contains("dark-mode")) {
                text.textContent = "The lights are OFF!";
            } else {
                text.textContent = "The lights are ON!";
            }
        });

        // Change text when clicked
        text.addEventListener("click", function() {
            if (text.textContent === "Click this text!") {
                text.textContent = "You clicked the text!";
            } else {
                text.textContent = "Click this text!";
            }
        });
    </script>

    <footer>
        <a href="../../index.html">
                        Back to Student Portal
        </a>
    </footer>
</body>
</html>
