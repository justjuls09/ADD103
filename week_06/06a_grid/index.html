<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Wall</title>
    <!-- External Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="hero">
        <div class="hero-text">
            <h1>Adventure Photo Wall</h1>
            <p>Some photos of the girls and their silly moments.</p>
        </div>

    </header>

    <main>
        <section class="gallery-section">
            <h2>The Ladies!!!</h2>

            <div class="photo-wall">
                <img src="images/frankie.jpg" alt="Frankie">
                <img src="images/frankie_ball.jpg" alt="Frankie with her ball">
                <img src="images/girls.jpg" alt="The Girls">
                <img src="images/girls2.jpg" alt="The Girls on the bed">
                <img src="images/joppy.jpg" alt="Joppy">
                <img src="images/joppy_laying.jpg" alt="Joppy laying down">
            </div>
        </section>
    </main>

    <footer>
        <p>
            <a href="../index.html">Return to Portal Page</a>
        </p>
    </footer>

</body>
</html>
