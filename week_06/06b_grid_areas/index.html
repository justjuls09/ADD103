<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery V1</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 20px;
        }

        h1 {
            text-align: center;
        }

        .gallery-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }

        .main-display {
            grid-column: 1 / -1;
            height: 400px;
            border: 3px solid black;
        }

        .main-display img {
            width: 100%;
            height: 100%;
        }

        .thumb {
            border: 2px solid gray;
            cursor: pointer;
        }

        .thumb:hover {
            border-color: blue;
        }

        .thumb img {
            width: 100%;
        }
    </style>
</head>

<body>

    <h1>Nature & Architecture Gallery</h1>

    <div class="gallery-container">

        <!-- Main Display -->
        <div class="main-display" id="current">
            <img src="images/thumb1.jpg" alt="Main Display">
        </div>

        <!-- Thumbnails -->
        <div class="thumb">
            <img src="images/thumb1.jpg" alt="Thumbnail 1">
        </div>

        <div class="thumb">
            <img src="images/thumb2.jpg" alt="Thumbnail 2">
        </div>

        <div class="thumb">
            <img src="images/thumb3.jpg" alt="Thumbnail 3">
        </div>

        <div class="thumb">
            <img src="images/thumb4.jpg" alt="Thumbnail 4">
        </div>

        <div class="thumb">
            <img src="images/thumb5.jpg" alt="Thumbnail 5">
        </div>

    </div>
    <!-- FOOTER -->
       <footer>
       <a href="../../index.html">
                        Back to Student Portal
        </a>
        </footer>
</body>
</html>
